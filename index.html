<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Control de Caducidades</title>
    
    <meta name="theme-color" content="#ff4757">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff4757;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        #calendar {
            max-width: 100%;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .fc { color: var(--text-color); }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid var(--border-color); }
        .fc-daygrid-day:hover { background-color: #2a2a2a; cursor: pointer; }
        .fc-button-primary { background-color: var(--accent-color) !important; border: none !important; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            max-height: 85vh;
            overflow-y: auto;
        }

        #reader {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            width: 100%;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            margin-top: 0;
            width: auto;
            background-color: #333;
            border: 1px solid var(--border-color);
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .product-info {
            cursor: pointer;
            flex: 1;
        }

        .sku-tag {
            font-size: 11px;
            color: #888;
            display: block;
            margin-top: 2px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 18px;
            cursor: pointer;
            padding-left: 10px;
        }

        .manual-container {
            margin: 15px 0 5px 0; 
            display: flex; 
            gap: 8px;
        }

        .manual-input {
            flex: 1; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            background: #2a2a2a; 
            color: white; 
            font-size: 14px;
        }

        .product-img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="header-actions">
        <h2 style="color: var(--accent-color); margin: 0;">📅 Caducidades</h2>
        <button class="btn btn-sm" onclick="requestNotificationPermission()">🔔 Alertas</button>
    </div>
    
    <div id="calendar"></div>

    <!-- Modal Principal del Día -->
    <div id="actionModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Opciones del día</h3>
            
            <div class="manual-container">
                <input type="number" id="manualBarcodeInput" class="manual-input" placeholder="Código de barras manual...">
                <button class="btn" onclick="handleManualSearch()" style="margin: 0; width: auto; padding: 10px 15px;">🔍</button>
            </div>

            <div id="productList"></div>
            
            <div id="scannerSection" style="display:none; margin-top:15px;">
                <div id="reader"></div>
            </div>

            <button class="btn" id="btnScanToggle">Escanear por Cámara</button>
            <button class="btn" style="background-color: #555;" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <!-- Modal para Detalles del Producto -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <h3 id="detailTitle">Detalle del Producto</h3>
            <img id="detailImg" src="" alt="Imagen" class="product-img" style="display:none;">
            <p id="detailBrand" style="color:#aaa; margin: 5px 0;"></p>
            <p id="detailSku" style="font-size: 12px; color:#666;"></p>
            <p id="detailQuantity" style="font-weight: bold; color: var(--accent-color);"></p>
            <button class="btn" style="background-color: #555;" onclick="closeDetailModal()">Volver</button>
        </div>
    </div>

    <script>
        let calendar;
        let selectedDateStr = "";
        let html5QrcodeScanner = null;

        const manifestData = {
            "name": "Control de Caducidades",
            "short_name": "Caducidades",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#121212",
            "theme_color": "#ff4757",
            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/3652/3652191.png", "sizes": "512x512", "type": "image/png"}]
        };
        const stringManifest = JSON.stringify(manifestData);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                headerToolbar: { left: 'prev', center: 'title', right: 'next' },
                dateClick: function(info) { openDayActions(info.dateStr); }
            });
            calendar.render();
            renderEvents();
        });

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") alert("¡Notificaciones activadas!");
                });
            }
        }

        function openDayActions(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modalTitle').innerText = `Día: ${dateStr}`;
            document.getElementById('manualBarcodeInput').value = "";
            updateProductList();
            document.getElementById('actionModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('actionModal').style.display = 'none';
            stopScanner();
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function updateProductList() {
            const listDiv = document.getElementById('productList');
            listDiv.innerHTML = "";
            let db = JSON.parse(localStorage.getItem('caducidades')) || [];
            let filtrados = db.filter(item => item.fecha === selectedDateStr);

            if(filtrados.length === 0) {
                listDiv.innerHTML = "<p style='color:#aaa;'>No hay artículos registrados este día.</p>";
                return;
            }

            filtrados.forEach((item) => {
                let div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    <div class="product-info" onclick="showProductDetail('${item.id}')">
                        <strong>🛒 ${item.nombre} (x${item.cantidad || 1})</strong>
                        <span class="sku-tag">SKU / Cód: ${item.codigo}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteItem('${item.id}')">🗑️</button>`;
                listDiv.appendChild(div);
            });
        }

        function showProductDetail(id) {
            let db = JSON.parse(localStorage.getItem('caducidades')) || [];
            let item = db.find(i => i.id === id);

            if (!item) return;

            document.getElementById('detailTitle').innerText = item.nombre;
            document.getElementById('detailBrand').innerText = item.marca ? `Marca: ${item.marca}` : "Marca no especificada";
            document.getElementById('detailSku').innerText = `SKU / Código: ${item.codigo}`;
            document.getElementById('detailQuantity').innerText = `Cantidad registrada: ${item.cantidad || 1} ud(s).`;

            const imgEl = document.getElementById('detailImg');
            if (item.foto) {
                imgEl.src = item.foto;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            document.getElementById('detailModal').style.display = 'flex';
        }

        document.getElementById('btnScanToggle').addEventListener('click', function() {
            const section = document.getElementById('scannerSection');
            if(section.style.display === 'none') {
                section.style.display = 'block';
                startScanner();
            } else {
                stopScanner();
            }
        });

        function startScanner() {
            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = {
                fps: 20,
                qrbox: { width: 280, height: 120 },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.CODE_128
                ]
            };

            html5QrcodeScanner.start(
                { facingMode: "environment" },
                config,
                async (decodedText) => {
                    playBeep();
                    stopScanner();
                    await processProductEntry(decodedText);
                },
                () => {}
            ).catch(() => alert("Otorga permisos a la cámara para escanear."));
        }

        function stopScanner() {
            document.getElementById('scannerSection').style.display = 'none';
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => html5QrcodeScanner = null).catch(() => {});
            }
        }

        async function handleManualSearch() {
            const input = document.getElementById('manualBarcodeInput');
            const barcode = input.value.trim();

            if (!barcode) {
                alert("Ingresa un número de código de barras.");
                return;
            }

            playBeep();
            await processProductEntry(barcode);
            input.value = "";
        }

        async function processProductEntry(barcode) {
            let productData = await fetchProductData(barcode);
            
            if (productData) {
                let qtyInput = prompt(`Producto: "${productData.nombre}"\n¿Cuántas unidades deseas registrar?`, "1");
                let cantidad = parseInt(qtyInput, 10);
                
                if (isNaN(cantidad) || cantidad <= 0) cantidad = 1;

                saveItem(productData, barcode, cantidad);
            }
        }

        async function fetchProductData(barcode) {
            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`, {
                    headers: { 'User-Agent': 'MiAppCaducidades - WebApp - Version 2.0' }
                });
                const data = await response.json();

                if (data.status === 1 && data.product) {
                    const p = data.product;
                    return {
                        nombre: p.product_name_es || p.product_name || "Producto sin nombre",
                        foto: p.image_front_url || p.image_url || "",
                        marca: p.brands || ""
                    };
                } else {
                    let nombreManual = prompt("Código no encontrado en la API. Escribe un nombre para este artículo:");
                    if (!nombreManual) return null;
                    return { nombre: nombreManual, foto: "", marca: "" };
                }
            } catch (error) {
                let nombreManual = prompt("Sin conexión a la API. Escribe un nombre para este artículo:");
                if (!nombreManual) return null;
                return { nombre: nombreManual, foto: "", marca: "" };
            }
        }

        function saveItem(productData, codigo, cantidad) {
            let db = JSON.parse(localStorage.getItem('caducidades')) || [];
            db.push({
                id: Date.now().toString(),
                nombre: productData.nombre,
                foto: productData.foto,
                marca: productData.marca,
                codigo: codigo,
                cantidad: cantidad,
                fecha: selectedDateStr
            });
            localStorage.setItem('caducidades', JSON.stringify(db));
            updateProductList();
            renderEvents();
        }

        function deleteItem(id) {
            let db = JSON.parse(localStorage.getItem('caducidades')) || [];
            db = db.filter(item => item.id !== id);
            localStorage.setItem('caducidades', JSON.stringify(db));
            updateProductList();
            renderEvents();
        }

        function renderEvents() {
            calendar.removeAllEvents();
            let db = JSON.parse(localStorage.getItem('caducidades')) || [];
            db.forEach(item => {
                calendar.addEvent({
                    title: `(x${item.cantidad || 1}) ${item.nombre}`,
                    start: item.fecha,
                    allDay: true
                });
            });
        }
    </script>
</body>
</html>
