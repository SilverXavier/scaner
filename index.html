<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Control de Caducidades</title>
    
    <!-- Librerías de FullCalendar (Modo Oscuro/Estándar) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <!-- Librería para lectura de Código de Barras / QR -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff4757;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }

        #calendar {
            max-width: 100%;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .fc { color: var(--text-color); }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid var(--border-color); }
        .fc-daygrid-day:hover { background-color: #2a2a2a; cursor: pointer; }
        .fc-button-primary { background-color: var(--accent-color) !important; border: none !important; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        #reader {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            width: 100%;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: var(--accent-color);">📅 Mis Caducidades</h2>
    
    <div id="calendar"></div>

    <div id="actionModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Opciones del día</h3>
            
            <div id="productList"></div>
            
            <div id="scannerSection" style="display:none; margin-top:15px;">
                <div id="reader"></div>
            </div>

            <button class="btn" id="btnScanToggle">Escanear Artículo</button>
            <button class="btn" style="background-color: #555;" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script>
        let calendar;
        let selectedDateStr = "";
        let html5QrcodeScanner = null;

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                headerToolbar: { left: 'prev', center: 'title', right: 'next' },
                dateClick: function(info) {
                    openDayActions(info.dateStr);
                }
            });
            calendar.render();
            
            renderEvents();
            checkTodayExpirations();
        });

        function openDayActions(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modalTitle').innerText = `Día: ${dateStr}`;
            updateProductList();
            document.getElementById('actionModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('actionModal').style.display = 'none';
            stopScanner();
        }

        function updateProductList() {
            const listDiv = document.getElementById('productList');
            listDiv.innerHTML = "";
            let db = JSON.parse(localStorage.getItem('caducidades')) || [];
            let filtrados = db.filter(item => item.fecha === selectedDateStr);

            if(filtrados.length === 0) {
                listDiv.innerHTML = "<p style='color:#aaa;'>No hay artículos registrados este día.</p>";
                return;
            }

            filtrados.forEach((item) => {
                let div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `<span>🛒 ${item.nombre}</span> 
                                 <button class="btn-delete" onclick="deleteItem('${item.id}')">🗑️</button>`;
                listDiv.appendChild(div);
            });
        }

        document.getElementById('btnScanToggle').addEventListener('click', function() {
            const section = document.getElementById('scannerSection');
            if(section.style.display === 'none') {
                section.style.display = 'block';
                startScanner();
            } else {
                stopScanner();
            }
        });

        function startScanner() {
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                async (decodedText) => {
                    stopScanner();
                    let nombreProducto = await fetchProductName(decodedText);
                    if(nombreProducto) {
                        saveItem(nombreProducto, decodedText);
                    }
                },
                (errorMessage) => { /* Ignorar errores de escaneo continuo */ }
            ).catch(err => alert("Error al abrir cámara: Asegúrate de otorgar permisos."));
        }

        function stopScanner() {
            document.getElementById('scannerSection').style.display = 'none';
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => html5QrcodeScanner = null).catch(() => {});
            }
        }

        // Consulta a la API oficial de Open Food Facts v0
        async function fetchProductName(barcode) {
            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`, {
                    headers: { 'User-Agent': 'MiAppCaducidades - WebApp - Version 1.0' }
                });
                const data = await response.json();
                
                if (data.status === 1 && data.product && (data.product.product_name || data.product.product_name_es)) {
                    return data.product.product_name_es || data.product.product_name;
                } else {
                    return prompt("Código desconocido en internet. Escribe un nombre para este artículo:");
                }
            } catch (error) {
                return prompt("Sin conexión a internet. Escribe un nombre para este artículo:");
            }
        }

        function saveItem(nombre, codigo) {
            let db = JSON.parse(localStorage.getItem('caducidades')) || [];
            db.push({
                id: Date.now().toString(),
                nombre: nombre,
                codigo: codigo,
                fecha: selectedDateStr
            });
            localStorage.setItem('caducidades', JSON.stringify(db));
            updateProductList();
            renderEvents();
        }

        function deleteItem(id) {
            let db = JSON.parse(localStorage.getItem('caducidades')) || [];
            db = db.filter(item => item.id !== id);
            localStorage.setItem('caducidades', JSON.stringify(db));
            updateProductList();
            renderEvents();
        }

        function renderEvents() {
            calendar.removeAllEvents();
            let db = JSON.parse(localStorage.getItem('caducidades')) || [];
            db.forEach(item => {
                calendar.addEvent({
                    title: item.nombre,
                    start: item.fecha,
                    allDay: true
                });
            });
        }

        function checkTodayExpirations() {
            let db = JSON.parse(localStorage.getItem('caducidades')) || [];
            const hoy = new Date().toISOString().split('T')[0];
            let caducanHoy = db.filter(item => item.fecha === hoy);

            if(caducanHoy.length > 0) {
                alert(`⚠️ Atención: Tienes ${caducanHoy.length} producto(s) que caducan hoy.`);
            }
        }
    </script>
</body>
</html>
